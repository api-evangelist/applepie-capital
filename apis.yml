aid: applepie-capital
name: Applepie Capital
description: >-
  ApplePie Capital is a San Francisco-based franchise-finance marketplace lender
  that connects franchisees and franchisors with the capital they need to start,
  refinance, and grow multi-unit franchise businesses. Founded in 2014 by Denise
  Thomas, the company operates an online lending platform focused exclusively on
  franchising, offering conventional term loans, SBA loans, refinancing, equipment
  financing, and accounts-receivable financing, and partnering with banks such as
  Fifth Third and providers like LSQ. ApplePie has provided billions in loans across
  200+ franchise brand partners. It is backed by QED Investors and is tracked in the
  API Evangelist network as a fintech company profile; no public API or developer
  program has been identified as of this enrichment pass.
